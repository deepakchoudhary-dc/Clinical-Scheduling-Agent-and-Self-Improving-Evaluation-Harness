[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-scheduler"
version = "0.1.0"
description = "Constrained clinical scheduling agent with a closed-loop self-improvement harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Runtime dependencies are deliberately minimal. The scheduling kernel, policy
# engine, FSM, capability broker, oracle stack and improvement pipeline are pure
# standard library so that they are auditable and deterministic. Only the model
# adapter boundary and validation layer pull third-party code.
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
csched = "clinical_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "property: property-based / metamorphic invariants",
    "concurrency: real multi-connection race tests",
    "security: adversarial and injection tests",
    "integration: end-to-end tests over a real loopback transport",
]

[tool.ruff]
line-length = 100
target-version = "py311"
